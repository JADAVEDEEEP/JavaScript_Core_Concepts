<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
  <title>Asynchronous JavaScript</title>
</head>
<body>
  <main class="container">
    <h1>Bhaichara on Top</h1>
    <h1>Country Details</h1>
    <div class="countries">
      <!-- India -->
      <article class="country">
        <img class="country__img" src="https://upload.wikimedia.org/wikipedia/en/4/41/Flag_of_India.svg" alt="India Flag" />
        <div class="country__data">
          <h3 class="country__name">India</h3>
          <h4 class="country__region">Asia</h4>
          <p class="country__row"><span>👫</span>1.4 Billion people</p>
          <p class="country__row"><span>🗣️</span>Hindi, English</p>
          <p class="country__row"><span>💰</span>INR (Indian Rupee)</p>
        </div>
      </article>
      <!-- Russia -->
      <article class="country">
        <img class="country__img" src="https://upload.wikimedia.org/wikipedia/en/f/f3/Flag_of_Russia.svg" alt="Russia Flag" />
        <div class="country__data">
          <h3 class="country__name">Russia</h3>
          <h4 class="country__region">Europe & Asia</h4>
          <p class="country__row"><span>👫</span>144 Million people</p>
          <p class="country__row"><span>🗣️</span>Russian</p>
          <p class="country__row"><span>💰</span>RUB (Russian Ruble)</p>
        </div>
      </article>
    </div>
    <button class="btn-country">Where am I?</button>
    <div class="images"></div>
  </main>
</body>
</html>
